<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneOffice DocFlow</title>
<link rel="icon" type="image/png" href="/ui/brand/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* OneOffice Automation brand: ocean blue + violet rings */
  --brand-blue:#07649C; --brand-blue-d:#004F80; --brand-blue-l:#1C77B0; --brand-violet:#6B40C2; --brand-violet-l:#8458D8;
  --grad:linear-gradient(90deg,#06598B 0%,#6B40C2 100%); --grad-soft:linear-gradient(120deg,#EAF3FA 0%,#F1ECFB 100%);
  --bg:#F4F6FB; --panel:#ffffff; --panel2:#F7F8FC; --ink:#14203A; --muted:#5E6A82; --line:#E3E7F0;
  --accent:#07649C; --accent-ink:#ffffff; --accent-soft:#E6F1F8; --brand2:#6B40C2;
  --nav:#ffffff; --nav-ink:#3D4A63; --nav-hover:#F1F4FA; --nav-on:#EEF0FB; --info:#6B40C2; --info-soft:#F0EAFB;
  --ok:#14804a; --ok-soft:#e7f6ee; --warn:#b54708; --warn-soft:#fff4e5; --bad:#c01f1f; --bad-soft:#fdecec;
  --t1:#07649C; --t1-soft:#E6F1F8; --t2:#6B40C2; --t2-soft:#F0EAFB; --t3:#B0307E; --t3-soft:#FBEAF4;
  --shadow:0 1px 2px rgba(20,32,58,.05),0 2px 6px rgba(20,32,58,.06); --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --grad:linear-gradient(90deg,#1C77B0 0%,#8458D8 100%); --grad-soft:linear-gradient(120deg,#13233A 0%,#1E1838 100%);
  --bg:#0C1220; --panel:#141B2C; --panel2:#182033; --ink:#E6EAF4; --muted:#98A3BC; --line:#26304A;
  --accent:#4FA3DB; --accent-ink:#06121F; --accent-soft:#12283F; --brand2:#A88BF0;
  --nav:#101728; --nav-ink:#B7C1D8; --nav-hover:#18213A; --nav-on:#1D2545; --info:#A88BF0; --info-soft:#221B3D;
  --ok:#4ac08a; --ok-soft:#14281f; --warn:#f5a54a; --warn-soft:#2c2112; --bad:#f07171; --bad-soft:#2d1717;
  --t1:#4FA3DB; --t1-soft:#12283F; --t2:#A88BF0; --t2-soft:#221B3D; --t3:#E879B9; --t3-soft:#2D1626;
  --shadow:none; } }
*{box-sizing:border-box} html,body{height:100%} [hidden]{display:none!important} a.btn{text-decoration:none;color:inherit} a.btn.primary{color:var(--accent-ink)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,-apple-system,Tahoma,sans-serif}
a{color:var(--accent)} code,.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.app.embed{grid-template-columns:minmax(0,1fr)}
.app.embed nav{display:none}
nav{background:var(--nav);color:var(--nav-ink);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px 16px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.brand img{width:46px;height:auto;flex:none}
.brand .bt{font-family:Poppins,"Segoe UI",sans-serif;font-weight:700;font-size:16px;line-height:1.15;color:var(--ink)}
.brand .bt .one{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
nav .sec{color:var(--muted);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;padding:14px 10px 5px}
nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;color:var(--nav-ink);text-decoration:none;font-size:13.5px;position:relative}
nav a:hover{background:var(--nav-hover);color:var(--ink)}
nav a.active{background:var(--nav-on);color:var(--ink);font-weight:600}
nav a.active::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--grad)}
nav a .one{font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
nav a small{margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:400}
.navfoot{margin-top:18px;padding:12px 10px 0;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.navfoot img{width:120px;display:block;margin-bottom:6px;opacity:.9}
nav .ni{width:18px;text-align:center;opacity:.85}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
main{padding:22px 28px 60px;min-width:0}
.head{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.head h1{font-size:21px;margin:0;font-family:Poppins,"Segoe UI",sans-serif;font-weight:600}.head p{margin:4px 0 0;color:var(--muted)}
.head .grow{flex:1;min-width:240px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;overflow-x:auto}
.pad{padding:16px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:1100px){.g3{grid-template-columns:minmax(0,1fr)}.g2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){.app{grid-template-columns:minmax(0,1fr)}nav{position:static;height:auto}main{padding:16px}}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel2)} .btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 2px 6px rgba(76,60,170,.25)}
.btn.primary:hover{filter:brightness(1.07)} .btn.sm{padding:4px 9px;font-size:13px} .btn.ghost{border-color:transparent;background:transparent}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.mute{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.pill.t1{background:var(--t1-soft);color:var(--t1)}.pill.t2{background:var(--t2-soft);color:var(--t2)}.pill.t3{background:var(--t3-soft);color:var(--t3)}
.chip{display:inline-block;padding:1px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-size:12px;margin:2px 3px 0 0;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:12.5px} .right{text-align:right}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
label.f{display:block;margin-bottom:12px} label.f>span{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
label.f>em{display:block;font-style:normal;color:var(--muted);font-size:12px;margin-top:3px}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea{min-height:90px;resize:vertical}
.switch{position:relative;display:inline-block;width:40px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:22px;transition:.15s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--grad)}.switch input:checked+span:before{transform:translateX(18px)}
.option-card{border-top:4px solid var(--c);}
.option-card h3{margin:0 0 4px;font-size:16px}
.big{font-size:26px;font-weight:700}
.engine{display:flex;flex-direction:column}
.engine .top{display:flex;gap:10px;align-items:flex-start}
.engine h3{margin:0;font-size:15px}.engine .vendor{color:var(--muted);font-size:12.5px}
.engine .body{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.engine.off{opacity:.65}
.reason{font-size:12.5px;color:var(--muted);margin-top:6px}
.result{margin-top:10px;padding:8px 10px;border-radius:8px;font-size:13px}
.result.ok{background:var(--ok-soft);color:var(--ok)}.result.bad{background:var(--bad-soft);color:var(--bad)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;background:var(--panel2)}
tr:last-child td{border-bottom:none}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.mid i{background:var(--warn)}.bar.low i{background:var(--bad)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;cursor:pointer;background:var(--panel2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.viewer{position:relative;display:inline-block;max-width:100%;border:1px solid var(--line);background:#fff}
.viewer img{display:block;max-width:100%}
.box{position:absolute;pointer-events:none}
.box.line{border:1px solid rgba(36,87,214,.25)}
.box.field{border:2px solid var(--ok);background:rgba(20,128,74,.08)}
.box.field.lowc{border-color:var(--warn);background:rgba(181,71,8,.08)}
.box.hot{outline:3px solid var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
pre{white-space:pre-wrap;word-break:break-word;margin:0;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--panel2);padding:12px;border-radius:8px;border:1px solid var(--line);max-height:520px;overflow:auto}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media(max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}}
.toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast div{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);max-width:380px}
.toast div.err{background:var(--bad);color:#fff}
.empty{padding:28px;text-align:center;color:var(--muted)}
.lst a{display:block;padding:9px 12px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.lst a.on{background:var(--accent-soft)}
.fieldrow td{padding:5px 6px}.fieldrow input,.fieldrow select{padding:5px 7px}
#ftab{min-width:860px}#ftab select{min-width:112px}#ftab td:first-child input{min-width:140px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;display:inline-block}
@keyframes s{to{transform:rotate(360deg)}}
iframe{width:100%;height:calc(100vh - 140px);border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13.5px}.kv div:nth-child(odd){color:var(--muted)}

/* ---- Document Automation feature ---- */
.btn.disabled{opacity:.5;pointer-events:none}.btn.danger{color:var(--bad)}.center{text-align:center}
.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi .big{margin:4px 0 2px}.kpi.warnk{border-color:var(--warn)}.kpi.badk{border-color:var(--bad)}
.tplgrid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.tpl{display:block;text-align:left;cursor:pointer;color:var(--ink);text-decoration:none;font:inherit}.tpl:hover{border-color:var(--accent)}
.tpl.sel,.optpick.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.optpick{text-align:left;cursor:pointer;font:inherit;color:var(--ink);border-top:4px solid var(--c)}
.flabel{display:block;font-weight:600;font-size:13px;margin:4px 0 8px}
.stepper{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.stepper div{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:13px}
.stepper span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-size:12px;font-weight:700}
.stepper .on{color:var(--accent);border-color:var(--accent)}.stepper .on span{background:var(--grad);color:var(--accent-ink)}.stepper .done span{background:var(--ok);color:#fff}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px}.crumb a{color:var(--muted)}
.itable td{vertical-align:middle}
.dd{position:relative}.ddm{position:absolute;right:0;top:110%;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:20;min-width:230px;padding:4px}
.ddm button{display:block;width:100%;text-align:left;border:none;background:none;padding:8px 10px;border-radius:6px;cursor:pointer}.ddm button:hover{background:var(--panel2)}
.itabs{margin-top:4px}
.chipb{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer}.chipb.on{background:var(--grad);color:#fff;border-color:transparent}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}.stack i{display:block}
.chart{display:flex;align-items:flex-end;gap:6px;height:180px;margin-top:10px;overflow-x:auto}
.chart .col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:30px;flex:1}
.chart .bars{width:100%;max-width:28px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden;min-height:2px}.chart .bars i{display:block}
.lg{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.vsplit{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:1100px){.vsplit{grid-template-columns:minmax(0,1fr)}}
.vform{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;display:flex;flex-direction:column}
.vf{padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.vf label{display:flex;gap:8px;align-items:center;margin-bottom:5px}.vf.low{background:var(--warn-soft);border-color:#f3c98b}
.vf.act{outline:2px solid var(--accent)}.vf .req{font-size:11px;color:var(--muted)}.warnc{color:var(--warn);font-weight:600}
.vtab{min-width:100%}.vtab td{padding:3px}.vtab th{padding:4px 6px}.vtab input{padding:4px 6px;min-width:80px}
.vactions{display:flex;gap:8px;align-items:center;position:sticky;bottom:-16px;background:var(--panel);padding:10px 0 4px;margin-top:auto;border-top:1px solid var(--line);z-index:2}
.box.pick{pointer-events:auto;cursor:copy}.box.pick:hover{background:rgba(36,87,214,.15);border-color:var(--accent)}
.flash{background:var(--ok-soft)!important;transition:background .3s}
.xbtn{border:none;background:none;cursor:pointer;color:var(--muted);padding:0 0 0 2px}

/* ---- OneOffice DocFlow ---- */
.pill.info{background:var(--info-soft);color:var(--info)} .okc{color:var(--ok)} .badc{color:var(--bad)}
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;padding:26px;background:var(--grad-soft);align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:140px;background:url(/ui/brand/ooa-mark.svg) no-repeat center/contain;opacity:.08;pointer-events:none}
@media(max-width:1100px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:26px;margin:4px 0 6px;font-family:Poppins,"Segoe UI",sans-serif;font-weight:600}.hero p{color:var(--muted);margin:0;max-width:640px}.eyebrow{font-size:12px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;text-transform:uppercase;letter-spacing:.08em}
.hero-art{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ha{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:center}
.ha span{width:22px;height:22px;border-radius:50%;background:var(--grad);color:var(--accent-ink);display:grid;place-items:center;font-size:11px}
.dz{border:2px dashed var(--line);text-align:center;cursor:pointer;padding:28px;background:var(--panel2)}.dz.over{border-color:var(--accent);background:var(--accent-soft)}
.dz-ico{font-size:22px;width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;margin:0 auto 8px}
tr.child td{background:var(--panel2)} .tree{color:var(--muted);margin-right:6px} tr.overdue td{background:var(--bad-soft)}
.pipe{display:flex;align-items:stretch;gap:0;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.stage{flex:1;min-width:150px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink)}
.stage:hover{border-color:var(--accent)}.stage.on{border-color:var(--brand-violet);box-shadow:0 0 0 3px var(--info-soft);background:var(--grad-soft)}
.st-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.st-ic{font-size:16px}.st-n{font-size:11px;color:var(--muted);font-weight:700}
.pipe-arrow{display:grid;place-items:center;color:var(--muted);font-size:20px;padding:0 4px}
#stage h3{margin:0 0 4px;font-size:16px}.mini b{font-size:13.5px}
.rulec{margin-bottom:10px;border-left:4px solid var(--brand-violet)} .rulec input[type=text]{padding:5px 8px} .rulec>.row select,.rulec>.row input[type=text]{width:auto;flex:0 1 240px;min-width:0}
.dtpick{display:flex;gap:8px;align-items:flex-start;cursor:pointer}.dtpick.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}.dtpick.add{color:var(--accent);text-decoration:none;align-items:center;justify-content:center;font-weight:600}
.dtcard{display:block;color:var(--ink);text-decoration:none}.dtcard:hover{border-color:var(--accent)}
.btn.golive{background:var(--ok);border-color:var(--ok);color:#fff}
.flags{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.flag{padding:8px 12px;border-radius:8px;font-size:13px;background:var(--warn-soft);border-left:4px solid var(--warn)}
.flag.reject{background:var(--bad-soft);border-color:var(--bad)}.flag.warn{background:var(--panel2);border-color:var(--line)}
details summary{cursor:pointer;margin-bottom:6px}
.onet{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
</style>
</head>
<body>
<div class="app" id="app">
  <nav id="nav">
    <div class="brand"><img src="/ui/brand/ooa-mark.svg" alt="OneOffice Automation"><div class="bt"><span class="one">OneOffice</span> DocFlow<small>Document Automation</small></div></div>
    <a href="#/home" data-r="home" title="Everything at a glance"><span class="ni">⌂</span><span><span class="one">One</span> View</span></a>
    <a href="#/inbox" data-r="inbox" title="Smart Inbox: one place for every document"><span class="ni">📥</span><span><span class="one">One</span> Inbox</span></a>
    <a href="#/flows" data-r="flows" title="Doc Flows: document processes"><span class="ni">⇉</span><span><span class="one">One</span>Flow</span><small>processes</small></a>
    <a href="#/doctypes" data-r="doctypes" title="Doc Types library"><span class="ni">▤</span><span><span class="one">One</span> Library</span><small>doc types</small></a>
    <a href="#/review" data-r="review" title="Review Desk"><span class="ni">👤</span><span><span class="one">One</span> Desk</span><span class="pill warn" id="navReview" hidden></span></a>
    <a href="#/refdata" data-r="refdata" title="Reference Data: single source of truth"><span class="ni">⊞</span><span><span class="one">One</span> Source</span><small>master data</small></a>
    <div class="sec">OneEngine</div>
    <a href="#/overview" data-r="overview"><span class="ni">◎</span>Engine overview</a>
    <a href="#/option/tier1_opensource" data-r="option/tier1_opensource" title="Open-source engines"><span class="dot" style="background:var(--t1)"></span><span><span class="one">One</span>Core</span><small>open source</small></a>
    <a href="#/option/tier2_cloud" data-r="option/tier2_cloud" title="Cloud & licensed engines"><span class="dot" style="background:var(--t2)"></span><span><span class="one">One</span>Connect</span><small>cloud</small></a>
    <a href="#/option/tier3_ai" data-r="option/tier3_ai" title="AI extraction"><span class="dot" style="background:var(--t3)"></span><span><span class="one">One</span>Mind</span><small>AI</small></a>
    <a href="#/process" data-r="process"><span class="ni">⚡</span>One-click test</a>
    <a href="#/compare" data-r="compare"><span class="ni">⇆</span>One-to-one compare</a>
    <div class="sec">Admin</div>
    <a href="#/usage" data-r="usage"><span class="ni">▦</span><span><span class="one">One</span>Meter</span><small>usage</small></a>
    <a href="#/settings" data-r="settings"><span class="ni">⚙</span>Settings</a>
    <div class="navfoot"><img src="/ui/brand/ooa-logo.svg" alt="OneOffice Automation">OneOffice Automation <span id="navVer" style="float:right"></span></div>
  </nav>
  <main id="main"><div class="empty"><span class="spin"></span></div></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===================================================================== core */
const API = "/api/docs/v1";
const PACK = {
  tier1_opensource:{n:1, c:"var(--t1)", cls:"t1"},
  tier2_cloud:{n:2, c:"var(--t2)", cls:"t2"},
  tier3_ai:{n:3, c:"var(--t3)", cls:"t3"},
  core:{n:0, c:"var(--muted)", cls:"mute"}
};
const CAP_LABEL = {ocr_printed:"Printed text", ocr_handwriting:"Handwriting", screen_ocr:"Screen OCR", layout:"Layout",
  tables:"Tables", key_value:"Key-values", selection_marks:"Checkboxes", barcodes:"Barcodes", classify:"Classify",
  extract_schema:"Field extraction", prebuilt_models:"Prebuilt models", searchable_pdf:"Searchable PDF"};
const S = { providers:null, settings:null, profile:"", schemas:[] };
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isRtl = s => /[؀-ۿ]/.test(String(s||""));
const pct = v => v == null ? "–" : Math.round(v*100) + "%";
const params = new URLSearchParams(location.search);
if (params.get("embed") === "1") $("#app").classList.add("embed");
if (params.get("theme")) document.documentElement.dataset.theme = params.get("theme");

function token(){ try { return sessionStorage.getItem("docauto.token") || ""; } catch { return ""; } }
function setToken(t){ try { sessionStorage.setItem("docauto.token", t); } catch {} }
async function api(path, opts={}){
  const headers = Object.assign({}, opts.headers||{});
  if (token()) headers.Authorization = "Bearer " + token();
  if (opts.json !== undefined){ headers["Content-Type"]="application/json"; opts.body=JSON.stringify(opts.json); }
  const r = await fetch(API + path, {...opts, headers});
  if (r.status === 401){
    const t = prompt("This service requires an API token:");
    if (t){ setToken(t); return api(path, opts); }
  }
  const ct = r.headers.get("content-type")||"";
  const body = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok){ const msg = body && (body.message || body.detail) || r.statusText; throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg)); }
  return body;
}
function toast(msg, err=false){
  const d = document.createElement("div"); if (err) d.className="err"; d.textContent = msg;
  $("#toast").appendChild(d); setTimeout(()=>d.remove(), err?7000:3500);
}
async function loadCore(force=false){
  if (!S.providers || force){
    const p = await api("/providers"); S.providers = p.providers; S.profile = p.deploymentProfile; S.packs = p.optionPacks;
  }
  if (!S.settings || force) S.settings = await api("/admin/settings");
}
function statusOf(p){
  if (!p.allowedByPolicy) return {cls:"bad", text:"Blocked by policy", why:p.policyReason};
  if (p.available) return {cls:"ok", text:"Ready", why:p.reason};
  if (/not enabled/.test(p.reason)) return {cls:"mute", text:"Option off", why:p.reason};
  if (/not installed|No module/.test(p.reason)) return {cls:"warn", text:"Not installed", why:p.reason};
  if (/template/.test(p.reason)) return {cls:"mute", text:"Template", why:p.reason};
  return {cls:"warn", text:"Not configured", why:p.reason};
}
function ready(kind){ return (S.providers||[]).filter(p => p.available && p.allowedByPolicy && (!kind || p.kind===kind)); }
function bar(v){ if (v==null) return '<span class="muted">–</span>';
  const c = v>=.85?"":v>=.6?"mid":"low"; return `<div class="row" style="gap:6px;flex-wrap:nowrap"><div class="bar ${c}" style="width:70px"><i style="width:${Math.round(v*100)}%"></i></div><span class="small">${pct(v)}</span></div>`; }
function optName(pk){ return PACK[pk]&&PACK[pk].n ? "Option "+PACK[pk].n : "Built-in"; }
function profileLabel(p){ return {onprem_airgapped:"On-prem · air-gapped", onprem_hybrid:"On-prem · hybrid", cloud_saas:"Cloud (SaaS)"}[p] || p; }

/* ===================================================================== router */
const routes = {};
async function route(){
  const h = location.hash.replace(/^#\//,"") || "home";
  const [name, ...rest] = h.split("/");
  const navKey = /^flow\b/.test(h) ? (h.startsWith("flow/smart-inbox") ? "inbox" : "flows") : /^(doctype|teach)\b/.test(h) ? "doctypes" : /^doc\//.test(h) ? "home" : h;
  document.querySelectorAll("nav a[data-r]").forEach(a => a.classList.toggle("active", navKey.startsWith(a.dataset.r)));
  document.onkeydown = null;
  const main = $("#main"); main.innerHTML = '<div class="empty"><span class="spin"></span></div>';
  try { await loadCore(); await (routes[name] || routes.home)(main, rest.join("/")); }
  catch(e){ main.innerHTML = `<div class="card pad"><b>Could not load.</b><p class="muted">${esc(e.message)}</p><button class="btn" onclick="route()">Retry</button></div>`; }
  refreshReviewBadge();
}
window.addEventListener("hashchange", route);
async function refreshReviewBadge(){
  try { const r = await api("/df/review"); const b=$("#navReview"); b.hidden=!r.length; b.textContent=r.length; b.className="pill "+(r.some(x=>x.overdue)?"bad":"warn"); } catch {}
}

/* ===================================================================== overview */
routes.overview = async (el) => {
  const usage = await api("/usage?groupBy=option_pack").catch(()=>[]);
  const docs = await api("/documents?limit=8").catch(()=>[]);
  const u = Object.fromEntries(usage.map(x=>[x.k,x]));
  const cards = Object.entries(S.settings.packs).map(([pid, pk]) => {
    const engines = S.providers.filter(p=>p.optionPack===pid);
    const rdy = engines.filter(p=>p.available && p.allowedByPolicy).length;
    const us = u[pid] || {};
    return `<div class="card pad option-card" style="--c:${PACK[pid].c}">
      <div class="row"><h3>${esc(pk.title)}</h3><span class="sp"></span>
        <label class="switch" title="Enable option"><input type="checkbox" data-pack="${pid}" ${pk.enabled?"checked":""}><span></span></label></div>
      <p class="muted small" style="margin:2px 0 12px">${esc(pk.summary)}</p>
      <div class="row"><div><div class="big">${rdy}<span class="muted" style="font-size:15px;font-weight:400"> / ${engines.length}</span></div><div class="muted small">engines ready</div></div>
      <span class="sp"></span><div class="right"><div class="big" style="font-size:20px">${us.pages||0}</div><div class="muted small">pages processed</div></div></div>
      <div style="margin-top:12px">${engines.map(p=>{const s=statusOf(p);return `<span class="pill ${s.cls}" style="margin:0 4px 4px 0">${esc(p.displayName.split(" (")[0])}</span>`}).join("")}</div>
      <div style="margin-top:10px"><a class="btn sm" href="#/option/${pid}">Configure →</a></div></div>`;
  }).join("");
  el.innerHTML = `
  <div class="head"><div class="grow"><h1><span class="onet">One</span>Engine overview</h1>
    <p>The three engine options that learning instances can use. Switch an option off to hide it from every instance.</p></div>
    <div class="row"><span class="pill mute">Profile: ${esc(profileLabel(S.profile))}</span><a class="btn primary" href="#/process">Process a document</a></div></div>
  <div class="grid g3">${cards}</div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><div class="pad row"><b>Recent documents</b><span class="sp"></span><a class="small" href="#/process">New</a></div>
      ${docs.length ? `<table><tr><th>File</th><th>Status</th><th>When</th></tr>${docs.map(d=>`<tr>
        <td><a href="#/process/${d.id}">${esc(d.file_name)}</a></td>
        <td>${docStatus(d)}</td><td class="muted small">${esc((d.created_at||"").slice(0,16).replace("T"," "))}</td></tr>`).join("")}</table>`
        : '<div class="empty">No documents yet. Try one of the samples in the <code>samples</code> folder.</div>'}</div>
    <div class="card pad"><b>How the options work together</b>
      <ol class="small" style="padding-left:18px;margin:10px 0 0;line-height:1.7">
        <li><b>OneCore</b> runs on this machine for free; use it for screens, clean scans and air-gapped customers.</li>
        <li><b>OneConnect</b> adds commercial OCR/IDP (tables, handwriting, prebuilt invoice/ID models) with the customer's key or a resold key.</li>
        <li><b>OneMind</b> reads any document against a field list you define in <a href="#/types">Document types</a>.</li>
        <li>The <a href="#/settings">profile</a> decides which options may receive data; the router picks the cheapest allowed engine and falls back on errors.</li>
        <li>Low-confidence fields go to the <a href="#/review">Review queue</a>.</li></ol></div>
  </div>`;
  el.querySelectorAll("[data-pack]").forEach(cb => cb.onchange = () => togglePack(cb.dataset.pack, cb.checked));
};
function docStatus(d){
  if (d.job_status==="failed") return '<span class="pill bad">Failed</span>';
  if (d.review_status==="pending") return '<span class="pill warn">Needs review</span>';
  if (d.review_status==="completed") return '<span class="pill ok">Reviewed</span>';
  if (d.review_status==="rejected") return '<span class="pill bad">Rejected</span>';
  if (d.job_status==="running"||d.job_status==="queued") return '<span class="pill mute">Processing</span>';
  return '<span class="pill ok">Done</span>';
}
async function saveSettings(values, msg="Saved"){
  const r = await api("/admin/settings", {method:"PUT", json:{values}});
  S.providers = r.providers; S.profile = r.profile; S.settings = await api("/admin/settings");
  toast(Object.keys(r.changed).length ? msg : "No changes");
  return r;
}
async function togglePack(pid, on){
  try { await saveSettings({[S.settings.packs[pid].key]: on}, `${S.settings.packs[pid].title} ${on?"enabled":"disabled"}`); route(); }
  catch(e){ toast(e.message, true); }
}

/* ===================================================================== option pages */
routes.option = async (el, pid) => {
  const pk = S.settings.packs[pid]; if (!pk) { location.hash="#/overview"; return; }
  const engines = S.providers.filter(p => p.optionPack===pid || (pid==="tier1_opensource" && p.optionPack==="core"));
  const deny = (fieldVal("DOCAUTO_DENY")||"").split(",").map(s=>s.trim()).filter(Boolean);
  const extra = {
    tier1_opensource: `<div class="card pad" style="margin-bottom:14px"><b>When to use</b><p class="small muted" style="margin:6px 0 0">Screen OCR on Citrix/RDP/legacy apps, clean printed documents, digital PDFs, and any customer that must stay offline. Free and unlimited. For poor scans or handwriting, escalate to OneConnect.</p></div>`,
    tier2_cloud: `<div class="card pad" style="margin-bottom:14px"><b>Bring your own key or resell</b><p class="small muted" style="margin:6px 0 0">Enter the customer's own credentials below (billed by the vendor), or Oneoffice-owned keys for resold usage (metered in <a href="#/usage">Usage</a>). The deployment profile and allowed regions in <a href="#/settings">Settings</a> decide whether documents may be sent.</p></div>`,
    tier3_ai: `<div class="card pad" style="margin-bottom:14px"><b>Template-free extraction</b><p class="small muted" style="margin:6px 0 0">The model receives OCR text (and optionally page images) plus the field list from a <a href="#/types">Document type</a>, and must cite the OCR lines for every value. Values not found in the text are flagged for review. Use <b>self-hosted</b> for on-prem customers, <b>cloud</b> for best accuracy.</p></div>`
  }[pid];
  el.innerHTML = `
  <div class="head"><div class="grow"><div class="row"><span class="pill ${PACK[pid].cls}">${esc(pk.title.split(" · ")[0])}</span><h1>${esc(pk.title.split(" · ")[1])}</h1></div><p>${esc(pk.summary)}</p></div>
    <div class="row"><span class="muted small">Option enabled</span><label class="switch"><input type="checkbox" id="packToggle" ${pk.enabled?"checked":""}><span></span></label></div></div>
  ${extra}
  <div class="grid g2" id="engines">${engines.map(p => engineCard(p, deny)).join("")}</div>`;
  $("#packToggle").onchange = e => togglePack(pid, e.target.checked);
  engines.forEach(p => wireEngine(p, deny));
};
function fieldVal(key){
  const all = [...S.settings.deployment, ...S.settings.defaults, ...Object.values(S.settings.engines).flatMap(e=>e.fields)];
  const f = all.find(f=>f.key===key); return f ? f.value : "";
}
function inputFor(f, idp=""){
  const id = idp + f.key;
  let ctl;
  if (f.type==="select") ctl = `<select id="${id}">${f.options.map(o=>`<option value="${esc(o)}" ${o===f.value?"selected":""}>${esc(o||"(none)")}</option>`).join("")}</select>`;
  else if (f.type==="bool") ctl = `<label class="switch"><input type="checkbox" id="${id}" ${String(f.value).toLowerCase()==="true"?"checked":""}><span></span></label>`;
  else if (f.type==="engine"){
    const opts = (S.providers||[]).filter(p=>p.kind===f.kind);
    ctl = `<select id="${id}">${f.allowEmpty?`<option value="" ${!f.value?"selected":""}>(never)</option>`:""}${opts.map(p=>`<option value="${p.id}" ${p.id===f.value?"selected":""}>${esc(p.displayName)}${p.available&&p.allowedByPolicy?"":" (not ready)"}</option>`).join("")}</select>`;
  }
  else ctl = `<input type="${f.type==="secret"?"password":f.type==="number"?"number":"text"}" ${f.type==="number"?'step="0.01" min="0" max="1"':""} id="${id}" value="${esc(f.value)}" placeholder="${esc(f.placeholder||(f.type==="secret"&&f.isSet?"(saved)":""))}" autocomplete="off">`;
  return `<label class="f"><span>${esc(f.label||f.key)}</span>${ctl}${f.help?`<em>${esc(f.help)}</em>`:""}</label>`;
}
function readInput(f, idp=""){
  const el = document.getElementById(idp + f.key); if (!el) return undefined;
  return f.type==="bool" ? (el.checked?"true":"false") : el.value;
}
function engineCard(p, deny){
  const s = statusOf(p); const cfg = (S.settings.engines[p.id]||{fields:[],install:null});
  const builtin = p.optionPack==="core";
  const disabled = deny.includes(p.id);
  return `<div class="card pad engine ${disabled?"off":""}" id="eng-${p.id}">
    <div class="top"><div style="flex:1"><h3>${esc(p.displayName)}</h3><div class="vendor">${esc(p.vendor)} · ${p.kind==="ocr"?"OCR engine":"Extraction engine"}</div></div>
      <span class="pill ${disabled?"mute":s.cls}">${disabled?"Disabled":s.text}</span></div>
    <div style="margin-top:8px">${p.capabilities.map(c=>`<span class="chip">${esc(CAP_LABEL[c]||c)}</span>`).join("")}</div>
    <div class="kv" style="margin-top:10px">
      <div>Runs</div><div>${p.runsLocally?"On this machine (no data leaves)":"Remote service"+(p.regions&&p.regions.length?` · ${esc(p.regions.join(", "))}`:"")}</div>
      <div>Languages</div><div>${p.languages.includes("*")?"Many (vendor list)":esc(p.languages.join(", "))}</div>
      <div>Credits / page</div><div>${Object.values(p.creditCostPerPage).some(v=>v>0)?esc(Object.entries(p.creditCostPerPage).filter(([,v])=>v>0).map(([k,v])=>`${CAP_LABEL[k]||k} ${v}`).join(" · ")):"Free"}</div>
    </div>
    ${s.cls!=="ok" && s.why ? `<div class="reason">${esc(s.why)}</div>`:""}
    ${cfg.install?`<div class="reason">Install: <code>${esc(cfg.install)}</code> <button class="btn sm ghost" data-copy="${esc(cfg.install)}">Copy</button> then restart the service.</div>`:""}
    <div class="body">
      ${cfg.fields.length?`<form data-eng="${p.id}">${cfg.fields.map(f=>inputFor(f, p.id+"__")).join("")}</form>`:(builtin?'<div class="muted small">Built into the component. Always available.</div>':'<div class="muted small">No settings needed.</div>')}
      <div class="row" style="margin-top:4px">
        ${cfg.fields.length?`<button class="btn primary sm" data-save="${p.id}">Save</button>`:""}
        <button class="btn sm" data-test="${p.id}">Test engine</button><span class="sp"></span>
        ${builtin?"":`<span class="muted small">Enabled</span><label class="switch" title="Enable this engine"><input type="checkbox" data-deny="${p.id}" ${disabled?"":"checked"}><span></span></label>`}
      </div>
      <div data-out="${p.id}"></div>
    </div></div>`;
}
function wireEngine(p, deny){
  const card = document.getElementById("eng-"+p.id); if (!card) return;
  const cfg = S.settings.engines[p.id]||{fields:[]};
  const save = card.querySelector("[data-save]");
  if (save) save.onclick = async () => {
    const values = {}; cfg.fields.forEach(f => values[f.key] = readInput(f, p.id+"__"));
    save.disabled = true;
    try { await saveSettings(values, `${p.displayName}: settings saved`); route(); } catch(e){ toast(e.message, true); save.disabled=false; }
  };
  card.querySelector("[data-test]").onclick = async (ev) => {
    const out = card.querySelector("[data-out]"); out.innerHTML = '<div class="result"><span class="spin"></span> Testing…</div>';
    ev.target.disabled = true;
    try { const r = await api(`/admin/providers/${p.id}/test`, {method:"POST"});
      out.innerHTML = `<div class="result ${r.ok?"ok":"bad"}"><b>${r.ok?"Works":"Not working"}</b>: ${esc(r.message||"")}${r.ms!=null?` · ${r.ms} ms`:""}${r.output?`<div class="mono" style="margin-top:4px">${esc(r.output).slice(0,200)}</div>`:""}</div>`; }
    catch(e){ out.innerHTML = `<div class="result bad">${esc(e.message)}</div>`; }
    ev.target.disabled = false;
  };
  const dn = card.querySelector("[data-deny]");
  if (dn) dn.onchange = async () => {
    const cur = (fieldVal("DOCAUTO_DENY")||"").split(",").map(s=>s.trim()).filter(Boolean).filter(x=>x!==p.id);
    if (!dn.checked) cur.push(p.id);
    try { await saveSettings({DOCAUTO_DENY: cur.join(",")}, `${p.displayName} ${dn.checked?"enabled":"disabled"}`); route(); } catch(e){ toast(e.message,true); }
  };
  card.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => { navigator.clipboard?.writeText(b.dataset.copy); toast("Copied"); });
}

/* ===================================================================== process */
const LANGS = [["en","English"],["ar","Arabic"],["fr","French"],["de","German"],["hi","Hindi"],["ur","Urdu"],["zh","Chinese"]];
const FEATURES = [["tables","Tables"],["key_value","Key-values"],["ocr_handwriting","Handwriting"],["layout","Layout"]];
let P = { file:null, result:null, page:1, hot:null };
routes.process = async (el, docId) => {
  S.schemas = await api("/schemas");
  const ocr = ready("ocr"), ex = ready("extraction");
  el.innerHTML = `
  <div class="head"><div class="grow"><h1>One-click test</h1><p>Try engines on a single file without a learning instance. For production use, create a <a href="#/instances">learning instance</a>.</p></div></div>
  <div class="split">
    <div class="card pad">
      <div class="drop" id="drop"><b>Drop a file here</b> or click to choose<div class="muted small">PDF, PNG, JPG, TIFF</div><input type="file" id="file" hidden accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.webp"></div>
      <div id="fileName" class="small muted" style="margin:6px 0 12px"></div>
      <div class="grid g2">
        <label class="f"><span>Document type</span><select id="schema"><option value="">None: OCR only</option>${S.schemas.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("")}</select><em><a href="#/types">Manage document types</a></em></label>
        <label class="f"><span>Classify into (optional)</span><input type="text" id="classify" placeholder="invoice, contract, bank statement"></label>
        <label class="f"><span>OCR engine</span><select id="ocr"><option value="auto">Auto (router decides)</option>${ocr.filter(p=>p.id!=="pdf-text").map(p=>`<option value="${p.id}">${esc(p.displayName)} · ${optName(p.optionPack)}</option>`).join("")}</select></label>
        <label class="f"><span>Extraction engine</span><select id="ex"><option value="auto">Auto</option>${ex.map(p=>`<option value="${p.id}">${esc(p.displayName)}</option>`).join("")}</select></label>
      </div>
      <label class="f"><span>Languages</span><div class="row">${LANGS.map(([k,v])=>`<label class="row" style="gap:4px"><input type="checkbox" name="lang" value="${k}" ${k==="en"||k==="ar"?"checked":""}>${v}</label>`).join("")}</div></label>
      <label class="f"><span>Extra features</span><div class="row">${FEATURES.map(([k,v])=>`<label class="row" style="gap:4px"><input type="checkbox" name="feat" value="${k}">${v}</label>`).join("")}</div><em>Only engines that support every ticked feature are used.</em></label>
      <div class="row"><button class="btn primary" id="run" disabled>Run</button><span id="runState" class="muted small"></span></div>
    </div>
    <div class="card pad" id="summary"><div class="empty">Results appear here.</div></div>
  </div>
  <div id="resultArea" style="margin-top:16px"></div>`;
  wireDrop(f => { P.file=f; $("#fileName").textContent = `${f.name} · ${(f.size/1024).toFixed(0)} KB`; $("#run").disabled=false; });
  $("#run").onclick = runProcess;
  if (docId) { try { P.result = await api(`/documents/${docId}/result`); P.page=1; renderResult(); } catch(e){ toast(e.message,true); } }
};
function wireDrop(onFile){
  const d=$("#drop"), i=$("#file");
  d.onclick=()=>i.click(); i.onchange=()=>i.files[0]&&onFile(i.files[0]);
  d.ondragover=e=>{e.preventDefault();d.classList.add("over")}; d.ondragleave=()=>d.classList.remove("over");
  d.ondrop=e=>{e.preventDefault();d.classList.remove("over"); if(e.dataTransfer.files[0]) onFile(e.dataTransfer.files[0]);};
}
function currentOptions(ocrOverride){
  const langs=[...document.querySelectorAll('[name=lang]:checked')].map(x=>x.value);
  const feats=[...document.querySelectorAll('[name=feat]:checked')].map(x=>x.value);
  const o = { ocrProvider: ocrOverride || $("#ocr").value, extractionProvider: $("#ex")?$("#ex").value:"auto",
    languages: langs.length?langs:["en"], capabilities:["ocr_printed", ...feats] };
  if ($("#schema") && $("#schema").value) o.schemaId = $("#schema").value;
  const cl = $("#classify") && $("#classify").value.split(",").map(s=>s.trim()).filter(Boolean);
  if (cl && cl.length) o.classifyLabels = cl;
  return o;
}
async function submitFile(file, options){
  const fd = new FormData(); fd.append("file", file); fd.append("options", JSON.stringify(options));
  const headers = token()?{Authorization:"Bearer "+token()}:{};
  const r = await fetch(API + "/documents?wait=true", {method:"POST", body:fd, headers});
  const j = await r.json(); if (!r.ok) throw new Error(j.message||j.detail||r.statusText);
  if (j.status==="failed") throw new Error((j.error&&j.error.message)||"processing failed");
  return api(`/documents/${j.documentId}/result`);
}
async function runProcess(){
  const btn=$("#run"); btn.disabled=true; $("#runState").innerHTML='<span class="spin"></span> Processing…';
  try { P.result = await submitFile(P.file, currentOptions()); P.page=1; P.hot=null; renderResult(); $("#runState").textContent=""; refreshReviewBadge(); }
  catch(e){ $("#runState").textContent=""; toast(e.message, true); }
  btn.disabled=false;
}

function drawPage(){

function drawTab(t){

      return `<tr data-f="${esc(f.name)}" style="cursor:pointer"><td><b>${esc(f.name)}</b><div class="small muted">${esc(f.providerId)}</div></td><td>${v}${f.validation.errors.map(e=>`<div class="small" style="color:var(--bad)">${esc(e)}</div>`).join("")}</td><td>${bar(f.confidence)}</td></tr>`}).join("")}</table>`

    b.innerHTML = ts.length ? ts.map(({p,tb},i)=>{ const m=Array.from({length:tb.rows},()=>Array(tb.cols).fill("")); tb.cells.forEach(c=>{if(m[c.row]) m[c.row][c.col]=c.text});

      : '<div class="empty">No tables detected. Tick <b>Tables</b> and use an engine that supports them (OneConnect, or digital PDFs).</div>';
  } else if (t==="Key-values"){
    const kv = r.pages.flatMap(p=>p.keyValuePairs);
    b.innerHTML = kv.length ? `<table><tr><th>Key</th><th>Value</th><th>Confidence</th></tr>${kv.map(k=>`<tr><td>${esc(k.key)}</td><td>${esc(k.value)}</td><td>${bar(k.confidence)}</td></tr>`).join("")}</table>`
      : '<div class="empty">No key-value pairs. Tick <b>Key-values</b> and use a OneConnect engine.</div>';
  } else {
    const copy = JSON.parse(JSON.stringify(r)); copy.pages = copy.pages.map(p=>({...p, words:`(${p.words.length} words)`}));
    b.innerHTML = `<pre>${esc(JSON.stringify(copy,null,2))}</pre>`;
  }
}

function collect(){
  const t=T.cur; t.name=$("#tName").value.trim(); t.id=$("#tId").value.trim()||undefined; t.description=$("#tDesc").value.trim();
  t.validation=$("#tRules").value.split("\n").map(s=>s.trim()).filter(Boolean);

    tr.querySelectorAll("[data-k]").forEach(inp=>{ const k=inp.dataset.k;
      if(k==="required") f.required=inp.checked; else if(k==="aliases") f.aliases=inp.value.split(",").map(s=>s.trim()).filter(Boolean);
      else if(k==="regex"||k==="label") f[k]=inp.value.trim()||undefined; else f[k]=inp.value.trim(); }); });
  t.fields=t.fields.filter(f=>f.name);
}
async function saveType(){
  collect(); const bad=T.cur.fields.find(f=>!/^[A-Za-z_][A-Za-z0-9_]*$/.test(f.name));
  if(bad){ toast(`Field name "${bad.name}" must be letters, digits, underscore`, true); return null; }
  if(!T.cur.fields.length){ toast("Add at least one field", true); return null; }
  try { const s=await api("/schemas",{method:"POST",json:T.cur}); T.cur=s; toast("Document type saved"); location.hash="#/types/"+encodeURIComponent(s.id); return s; }
  catch(e){ toast(e.message,true); return null; }
}

    <div class="card pad"><b>Deployment & policy</b><div style="margin-top:12px">${st.deployment.map(f=>inputFor(f,"s__")).join("")}</div></div>
    <div class="card pad"><b>Defaults & review</b><div style="margin-top:12px">${st.defaults.map(f=>inputFor(f,"s__")).join("")}</div></div>
  </div>
  <div class="row" style="margin-top:14px"><button class="btn primary" id="saveS">Save settings</button>
    <span class="muted small">This page's API token: </span><input type="password" id="tok" style="width:220px" value="${esc(token())}" placeholder="only if DOCAUTO_API_TOKEN is set"><button class="btn sm" id="tokB">Use</button></div>`;
  $("#saveS").onclick = async () => {
    const values={}; [...st.deployment, ...st.defaults].forEach(f=>{ const v=readInput(f,"s__"); if(v!==undefined) values[f.key]=v; });
    try { await saveSettings(values, "Settings saved and applied"); route(); } catch(e){ toast(e.message,true); }
  };
  $("#tokB").onclick=()=>{ setToken($("#tok").value.trim()); toast("Token set for this browser tab"); };
  updatesCard(el);
};
async function updatesCard(el){
  let v; try { v = await api("/admin/version"); } catch { return; }
  const box = document.createElement("div"); box.className = "card pad"; box.style.marginTop = "14px"; box.id = "updates";
  const repoTxt = v.repo ? `<a href="https://github.com/${esc(v.repo)}" target="_blank" rel="noopener">${esc(v.repo)}</a> · ${esc(v.ref)}` : '<span class="muted">not linked yet: the first update asks for it</span>';
  box.innerHTML = `<div class="row"><b>Updates & install</b><span class="sp"></span><span class="pill">v${esc(v.version)}${v.commit?` · ${esc(v.commit)}`:""}</span></div>
    <div class="grid g2" style="margin-top:10px">
      <div><div class="kv"><div>GitHub source</div><div>${repoTxt}</div>
        <div>Installed</div><div>${v.installedAt?esc(v.installedAt.replace("T"," ")):(v.gitWorkingCopy?"git working copy":"manual install")}</div>
        <div>Folder</div><div style="word-break:break-all"><code>${esc(v.folder)}</code></div></div>
        <p class="small muted" style="margin:8px 0 0">Updates keep your settings, keys, flows, documents and database; the previous version is backed up to <code>backups</code>.</p></div>
      <div><div class="row" style="flex-wrap:wrap;gap:8px">
        <button class="btn primary" id="updNow" ${v.canUpdate?"":"disabled"}>Update from GitHub</button>
        <button class="btn" id="updInst">Installer for another PC</button></div>
        <p class="small muted" style="margin:8px 0 0">${v.canUpdate?"Opens the updater window: it downloads the latest version, restarts DocFlow, and this page reconnects.":"One-click update works on Windows installs. Here, run <code>windows/get-docflow.ps1</code> or <code>git pull</code>."}
        The installer is a small .bat file: double-click it on a new PC and it installs Python, Tesseract and DocFlow.</p></div>
    </div>`;
  el.appendChild(box);
  $("#updNow").onclick = async () => {
    if (!confirm("Update DocFlow now? DocFlow stops for about a minute while the new version is installed.")) return;
    try { await api("/admin/update", {method:"POST"}); toast("Updater opened in a new window. This page reloads when DocFlow is back.");
      waitForRestart(); } catch(e){ toast(e.message,true); }
  };
  $("#updInst").onclick = async () => {
    try { const r = await fetch(API+"/admin/installer.bat", {headers: token()?{Authorization:"Bearer "+token()}:{}});
      if (!r.ok) throw new Error("download failed ("+r.status+")");
      const a = document.createElement("a"); a.href = URL.createObjectURL(await r.blob()); a.download = "Install-OneOffice-DocFlow.bat"; a.click();
    } catch(e){ toast(e.message,true); }
  };
}
async function waitForRestart(){
  let down = false;
  for (let i = 0; i < 200; i++) {
    await new Promise(r => setTimeout(r, 3000));
    try { const r = await fetch(API+"/admin/version", {cache:"no-store"}); if (r.ok && down) { location.reload(); return; } if (!r.ok) down = true; }
    catch { down = true; }
  }
}
async function showVersion(){
  try { const v = await api("/admin/version"); const f = document.getElementById("navVer"); if (f) f.textContent = "v" + v.version + (v.commit ? " · " + v.commit : ""); } catch {}
}
document.addEventListener("DOMContentLoaded", showVersion);

document.addEventListener("DOMContentLoaded", route);
</script>
<script src="/ui/docflow.js"></script>
</body>
</html>
