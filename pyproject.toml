[project]
name = "oneoffice-docauto"
version = "1.0.0"
description = "Pluggable Document Automation (OCR + IDP) component for the Oneoffice RPA platform"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "python-multipart>=0.0.9", "pyyaml>=6.0",
  "httpx>=0.27", "pillow>=10.0", "numpy>=1.26", "opencv-python-headless>=4.9", "pypdfium2>=4.28",
  "pdfplumber>=0.11", "openpyxl>=3.1", "pytesseract>=0.3.10"]

[project.optional-dependencies]
paddle = ["paddleocr", "paddlepaddle"]
aws = ["boto3"]
google = ["google-cloud-documentai"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["docauto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
