<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validation Station</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --ink:#1d2330; --muted:#6b7385; --line:#e3e6ec; --accent:#2457d6;
          --warn:#b45309; --warnbg:#fff4e5; --ok:#15803d; --bad:#b91c1c; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, "Segoe UI", Tahoma, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; flex:1; }
  input, select, button { font:inherit; }
  .layout { display:grid; grid-template-columns: 240px 1fr 380px; height: calc(100vh - 50px); }
  aside, .viewer, .form { overflow:auto; }
  aside { border-right:1px solid var(--line); background:var(--panel); }
  .item { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:hover, .item.active { background:#eef3ff; }
  .item small { color:var(--muted); display:block; }
  .viewer { padding:16px; }
  .pagewrap { position:relative; display:inline-block; box-shadow:0 1px 4px rgba(0,0,0,.12); background:#fff; }
  .pagewrap img { display:block; max-width:100%; }
  .box { position:absolute; border:2px solid var(--accent); background:rgba(36,87,214,.08); pointer-events:none; }
  .form { border-left:1px solid var(--line); background:var(--panel); padding:16px; }
  .field { margin-bottom:12px; padding:8px; border-radius:6px; border:1px solid var(--line); }
  .field.low { background:var(--warnbg); border-color:#f3c98b; }
  .field label { display:flex; justify-content:space-between; font-weight:600; margin-bottom:4px; }
  .field label span { font-weight:400; color:var(--muted); }
  .field input, .field textarea { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:4px; }
  .field textarea { min-height:70px; font-family: ui-monospace, monospace; font-size:12px; }
  .err { color:var(--bad); font-size:12px; }
  .actions { display:flex; gap:8px; position:sticky; bottom:0; background:var(--panel); padding-top:8px; }
  button { padding:8px 14px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { color:var(--bad); }
  .muted { color:var(--muted); }
  .pager { margin-bottom:8px; display:flex; gap:8px; align-items:center; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; height:auto; } }
</style>
</head>
<body>
<header>
  <h1>Validation Station</h1>
  <input id="reviewer" placeholder="Reviewer name" value="reviewer">
  <input id="token" placeholder="API token (optional)" type="password">
  <button onclick="loadQueue()">Refresh</button>
</header>
<div class="layout">
  <aside id="queue"><div class="item muted">Loading…</div></aside>
  <section class="viewer">
    <div class="pager" id="pager" hidden>
      <button onclick="go(-1)">◀</button><span id="pageno"></span><button onclick="go(1)">▶</button>
    </div>
    <div class="pagewrap" id="pagewrap"><p class="muted" style="padding:24px">Select a document from the queue.</p></div>
  </section>
  <section class="form" id="form"></section>
</div>
<script>
const API = "/api/docs/v1";
let current = null, page = 1;
const hdr = () => { const t = document.getElementById("token").value; return t ? {Authorization: "Bearer " + t} : {}; };
const isRtl = s => /[؀-ۿ]/.test(String(s || ""));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function loadQueue() {
  const r = await fetch(API + "/reviews?status=pending", {headers: hdr()});
  const items = r.ok ? await r.json() : [];
  const q = document.getElementById("queue");
  q.innerHTML = items.length ? "" : '<div class="item muted">No documents waiting for review.</div>';
  for (const it of items) {
    const d = document.createElement("div");
    d.className = "item"; d.dataset.id = it.id;
    d.innerHTML = `${esc(it.file_name)}<small>${esc(it.created_at.slice(0,19).replace("T"," "))}</small>`;
    d.onclick = () => open(it.id);
    q.appendChild(d);
  }
}

async function open(id) {
  document.querySelectorAll(".item").forEach(e => e.classList.toggle("active", e.dataset.id === id));
  const r = await fetch(`${API}/documents/${id}/result`, {headers: hdr()});
  current = await r.json(); page = 1;
  renderPage(); renderForm();
}

function go(delta) {
  const n = current.pages.length;
  page = Math.min(n, Math.max(1, page + delta)); renderPage();
}

function renderPage(highlight) {
  const n = current.pages.length;
  document.getElementById("pager").hidden = n < 2;
  document.getElementById("pageno").textContent = `Page ${page} / ${n}`;
  const w = document.getElementById("pagewrap");
  w.innerHTML = `<img src="${API}/documents/${current.documentId}/page/${page}.png" alt="page ${page}">`;
  if (highlight && highlight.bbox && highlight.page === page) {
    const b = highlight.bbox, box = document.createElement("div");
    box.className = "box";
    Object.assign(box.style, {left: b.x*100+"%", top: b.y*100+"%", width: b.w*100+"%", height: b.h*100+"%"});
    w.appendChild(box);
  }
}

function renderForm() {
  const f = document.getElementById("form");
  const cls = current.classification ? `<p><b>Type:</b> ${esc(current.classification.label)}
     <span class="muted">(${Math.round((current.classification.confidence||0)*100)}%)</span></p>` : "";
  const warn = (current.warnings || []).map(w => `<div class="err">${esc(w)}</div>`).join("");
  f.innerHTML = `<h3 style="margin-top:0">${esc(current.source.fileName || current.documentId)}</h3>${cls}${warn}<div id="fields"></div>
    <div class="actions"><button class="primary" onclick="submit(false)">Approve</button>
    <button class="danger" onclick="submit(true)">Reject</button></div>`;
  const box = document.getElementById("fields");
  current.fields.forEach((fld, i) => {
    const low = (fld.confidence ?? 0) < 0.85 || !fld.validation.passed;
    const isComplex = Array.isArray(fld.value) || (fld.value && typeof fld.value === "object");
    const val = isComplex ? JSON.stringify(fld.value, null, 1) : (fld.value ?? "");
    const dir = isRtl(val) ? "rtl" : "ltr";
    const div = document.createElement("div");
    div.className = "field" + (low ? " low" : "");
    div.innerHTML = `<label>${esc(fld.name)} <span>${fld.confidence == null ? "–" : Math.round(fld.confidence*100)+"%"}</span></label>
      ${isComplex ? `<textarea data-i="${i}" data-json="1" dir="${dir}">${esc(val)}</textarea>`
                  : `<input data-i="${i}" dir="${dir}" value="${esc(val)}">`}
      ${fld.validation.errors.map(e => `<div class="err">${esc(e)}</div>`).join("")}`;
    div.querySelector("input,textarea").addEventListener("focus", () => {
      if (fld.page && fld.page !== page) page = fld.page;
      renderPage(fld);
    });
    box.appendChild(div);
  });
}

async function submit(reject) {
  const fields = {};
  document.querySelectorAll("#fields [data-i]").forEach(el => {
    const fld = current.fields[+el.dataset.i];
    let v = el.value;
    if (el.dataset.json) { try { v = JSON.parse(v); } catch { alert(`${fld.name}: invalid JSON`); throw 0; } }
    else if (["number","currency"].includes(fld.type) && v !== "") v = Number(v);
    else if (v === "") v = null;
    fields[fld.name] = v;
  });
  const r = await fetch(`${API}/reviews/${current.documentId}/complete`, {
    method: "POST", headers: {...hdr(), "Content-Type": "application/json"},
    body: JSON.stringify({reviewer: document.getElementById("reviewer").value || "reviewer", fields, reject})});
  if (!r.ok) { alert("Submit failed: " + await r.text()); return; }
  document.getElementById("form").innerHTML = '<p class="muted">Saved. Pick the next document.</p>';
  document.getElementById("pagewrap").innerHTML = "";
  loadQueue();
}
loadQueue().then(() => { const d = new URLSearchParams(location.search).get("doc"); if (d) open(d); });
</script>
</body>
</html>
