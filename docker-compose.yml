services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docflow
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: ${DOCFLOW_DB_PASSWORD:-change-me}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - docflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow -d docflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  docauto:
    build: .
    image: oneoffice/docauto:3.1.1
    ports: ["8085:8085"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOCAUTO_CONFIG: /app/config/document-service.yaml
      DOCAUTO_API_TOKEN: ${DOCAUTO_API_TOKEN:-}
      DOCAUTO_DATABASE_URL: postgresql://docflow:${DOCFLOW_DB_PASSWORD:-change-me}@postgres:5432/docflow
      # Fernet key for documents at rest; empty = generated into the data volume (data/file.key) on first start
      DOCAUTO_FILE_KEY: ${DOCAUTO_FILE_KEY:-}
      DOCAUTO_RETENTION_DAYS: ${DOCAUTO_RETENTION_DAYS:-30}
      DOCAUTO_PLATFORM_URL: ${DOCAUTO_PLATFORM_URL:-}
      # Option pack 2 / 3 credentials (leave empty to keep those engines disabled)
      AZURE_DI_ENDPOINT: ${AZURE_DI_ENDPOINT:-}
      AZURE_DI_KEY: ${AZURE_DI_KEY:-}
      AZURE_DI_REGION: ${AZURE_DI_REGION:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-}
    volumes:
      - docauto-data:/app/data
      - ./config:/app/config:ro
volumes:
  docauto-data:
  docflow-db:
